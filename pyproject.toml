[project]
name = "noadcast"
version = "0.2.0"
description = "Self-hosted podcast server: RSS polling, local transcription, and transcript-based ad detection for the Noadcast iOS app."
readme = "README.md"
authors = [
    { name = "Isaac Khor", email = "s.github@isaackhor.com" }
]
requires-python = ">=3.13"
dependencies = [
    "av>=18.1",
    "fastapi>=0.115",
    # Batched-pipeline internals (VAD forcing, word alignment) were verified
    # against 1.2.x; re-verify before moving to a new minor version.
    "faster-whisper>=1.2.1,<1.3",
    "httpx>=0.28",
    # CUDA runtime for CTranslate2's GPU path (it links CUDA 12 / cuDNN 9);
    # the transcription worker preloads these, so no LD_LIBRARY_PATH is needed.
    "nvidia-cublas-cu12>=12,<13; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
    "numpy>=2.0",
    "onnxruntime>=1.30",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
noadcast = "noadcast.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
