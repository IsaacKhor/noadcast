[project]
name = "noadcast-ad-server"
version = "0.1.0"
description = "Local Noadcast ad-detection backend using whisper.cpp and Gemini."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
noadcast-ad-server = "main:main"
